<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Admin — Sidebar Permissions</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-page:       #f5f4f0;
    --bg-sidebar:    #eeece8;
    --bg-card:       #ffffff;
    --bg-hover:      #e6e4df;
    --bg-active:     #dbeafe;
    --bg-locked:     #f5f4f0;
    --border:        #d8d6d0;
    --text-primary:  #1a1a18;
    --text-secondary:#6b6a65;
    --text-muted:    #a8a7a2;
    --text-active:   #1d4ed8;
    --accent-blue:   #2563eb;
    --accent-green:  #16a34a;
    --accent-purple: #7c3aed;
    --accent-amber:  #d97706;
    --accent-red:    #dc2626;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

body {
  font-family: var(--font);
  background: var(--bg-page);
  color: var(--text-primary);
  margin: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

 .wrap {
  display: flex;
  width: 100%;
  height: 100vh;
  background: var(--bg-card);
  overflow: hidden;
}

  /* SIDEBAR */
 .sidebar{
    width:260px;
    min-width:260px;
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    transition:.3s;
    z-index:1000;
}

.menu-btn{
    display:none;
    background:none;
    border:none;
    font-size:24px;
    cursor:pointer;
    padding:4px;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:999;
}

.overlay.show{
    opacity:1;
    visibility:visible;
}

  .sidebar-top { padding: 16px 14px 12px; border-bottom: 1px solid var(--border); }
  .gym-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .plan-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; margin-top: 6px; }
  .badge-starter    { background: #dcfce7; color: #15803d; }
  .badge-growth     { background: #dbeafe; color: #1d4ed8; }
  .badge-pro        { background: #ede9fe; color: #6d28d9; }
  .badge-enterprise { background: #fef3c7; color: #b45309; }

  .nav { flex: 1; overflow-y: auto; padding: 6px 0 8px; }
  .nav::-webkit-scrollbar { width: 4px; }
  .nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .nav-section { padding: 10px 14px 3px; font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; }

  .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--text-primary); transition: background .12s; user-select: none; }
  .nav-item:hover:not(.locked) { background: var(--bg-hover); }
  .nav-item.active { background: var(--bg-active); color: var(--text-active); border-right: 2px solid var(--accent-blue); }
  .nav-item.locked { opacity: .45; cursor: not-allowed; color: var(--text-muted); }
  .nav-item .icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
  .nav-item .label { flex: 1; }
  .lock { font-size: 11px; color: var(--text-muted); }

  .upgrade-hint { margin: 8px 10px 10px; padding: 9px 11px; background: #ede9fe; border: 1px solid #c4b5fd; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: background .12s; }
  .upgrade-hint:hover { background: #ddd6fe; }
  .upgrade-hint span { font-size: 12px; color: #6d28d9; font-weight: 500; flex: 1; }
  .upgrade-hint .uh-icon { font-size: 16px; }
  .upgrade-hint.hidden { display: none; }

  /* MAIN */
  .main { flex: 1; background: var(--bg-page); display: flex; flex-direction: column; min-width: 0; }

  .topbar { padding: 13px 20px; border-bottom: 1px solid var(--border); background: var(--bg-card); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .topbar-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }

  .plan-switcher { display: flex; gap: 5px; flex-shrink: 0; }
  .plan-btn { padding: 5px 13px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; background: var(--bg-card); color: var(--text-secondary); transition: all .15s; font-family: var(--font); }
  .plan-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .plan-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

  .content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }

.stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
}
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .stat-val { font-size: 22px; font-weight: 600; color: var(--text-primary); }

  .module-preview { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; display: flex; align-items: center; gap: 12px; }
  .module-preview .mp-icon { font-size: 28px; }
  .module-preview .mp-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .module-preview .mp-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .locked-module { background: var(--bg-card); border: 1.5px dashed var(--border); border-radius: 10px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .locked-module .lm-icon { font-size: 32px; margin-bottom: 2px; }
  .locked-module .lm-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
  .locked-module .lm-sub { font-size: 12px; color: var(--text-muted); max-width: 260px; }
  .upgrade-cta { margin-top: 6px; padding: 7px 16px; background: var(--accent-purple); color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: background .12s; }
  .upgrade-cta:hover { background: #6d28d9; }

  /* Plan tier colors for badge */
  .tier-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  @media (max-width:768px){
    .sidebar{
        position:fixed;
        left:-260px;
        top:0;
        bottom:0;
    }

    .sidebar.open{
        left:0;
    }

    .menu-btn{
        display:block;
    }

  .topbar{
    flex-wrap:wrap;
    align-items:center;
  }

  .plan-switcher{
      display:flex;
      width:100%;
      overflow-x:auto;
      gap:8px;
      padding-top:8px;
  }
  
  .plan-switcher::-webkit-scrollbar{
      display:none;
  }
  
  .plan-btn{
      flex-shrink:0;
  }

    .stat-row{
        grid-template-columns:1fr;
    }

    .module-preview{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
<div class="wrap">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="gym-name">FitZone Gyms</div>
      <div class="plan-badge badge-starter" id="plan-badge">
        <span class="tier-dot" style="background:#16a34a"></span>
        <span id="plan-name">Starter</span>
      </div>
    </div>
    <div class="nav" id="nav-list"></div>
    <div class="upgrade-hint" id="upgrade-hint" onclick="showUpgrade()">
      <span class="uh-icon">⬆</span>
      <span id="upgrade-text">Upgrade to Growth — ₹2,499/mo</span>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">
    ☰
</button>
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <div class="plan-switcher">
        <button class="plan-btn active" onclick="setPlan('starter',this)">Starter</button>
        <button class="plan-btn" onclick="setPlan('growth',this)">Growth</button>
        <button class="plan-btn" onclick="setPlan('pro',this)">Pro</button>
        <button class="plan-btn" onclick="setPlan('enterprise',this)">Enterprise</button>
      </div>
    </div>
    <div class="content" id="main-content"></div>
  </div>
</div>

<script>
const PLANS = {
  starter: {
    label:'Starter', badgeClass:'badge-starter', dot:'#16a34a', price:'₹999/mo',
    modules:['dashboard','members','membership_plans','attendance','payments','settings']
  },
  growth: {
    label:'Growth', badgeClass:'badge-growth', dot:'#1d4ed8', price:'₹2,499/mo',
    modules:['dashboard','gym','branches','members','membership_plans','staff','attendance','payments','expenses','reports','notifications','leads','settings']
  },
  pro: {
    label:'Pro', badgeClass:'badge-pro', dot:'#6d28d9', price:'₹4,999/mo',
    modules:['dashboard','gym','branches','members','membership_plans','staff','attendance','payments','expenses','reports','notifications','leads','billing','rbac','equipment','reviews','coupons','settings']
  },
  enterprise: {
    label:'Enterprise', badgeClass:'badge-enterprise', dot:'#b45309', price:'₹9,999/mo',
    modules:['dashboard','gym','branches','members','membership_plans','staff','attendance','payments','expenses','reports','notifications','leads','billing','rbac','equipment','reviews','coupons','ai_chatbot','ai_insights','ai_churn','ai_forecasting','ai_workout','trainer_portal','member_portal','settings']
  }
};

const NAV = [
  {section:'Core'},
  {id:'dashboard',       label:'Dashboard',          icon:'🏠'},
  {id:'gym',             label:'Gym',                icon:'🏢'},
  {id:'branches',        label:'Branches',           icon:'🔀'},
  {section:'People'},
  {id:'members',         label:'Members',            icon:'👥'},
  {id:'staff',           label:'Staff',              icon:'🪪'},
  {id:'leads',           label:'Leads / CRM',        icon:'🎯'},
  {section:'Operations'},
  {id:'attendance',      label:'Attendance',         icon:'✅'},
  {id:'membership_plans',label:'Membership plans',   icon:'📋'},
  {id:'payments',        label:'Payments',           icon:'💳'},
  {id:'expenses',        label:'Expenses',           icon:'🧾'},
  {id:'equipment',       label:'Equipment',          icon:'🏋️'},
  {section:'Finance & Admin'},
  {id:'billing',         label:'Billing & invoices', icon:'🧮'},
  {id:'coupons',         label:'Coupons & referrals',icon:'🎟️'},
  {id:'rbac',            label:'Roles & permissions',icon:'🔐'},
  {section:'Analytics'},
  {id:'reports',         label:'Reports',            icon:'📊'},
  {id:'reviews',         label:'Reviews',            icon:'⭐'},
  {section:'AI Features'},
  {id:'ai_chatbot',      label:'AI support chatbot', icon:'🤖'},
  {id:'ai_insights',     label:'Attendance insights',icon:'🧠'},
  {id:'ai_churn',        label:'Churn prediction',   icon:'📉'},
  {id:'ai_forecasting',  label:'Revenue forecast',   icon:'📈'},
  {id:'ai_workout',      label:'Workout / diet AI',  icon:'💪'},
  {section:'Portals'},
  {id:'trainer_portal',  label:'Trainer portal',     icon:'🏅'},
  {id:'member_portal',   label:'Member portal',      icon:'📱'},
  {section:'System'},
  {id:'notifications',   label:'Notifications',      icon:'🔔'},
  {id:'settings',        label:'Settings',           icon:'⚙️'},
];

const MODULE_LABELS = {
  dashboard:'Dashboard overview',members:'Members list & profiles',staff:'Staff management',
  attendance:'Attendance tracker',payments:'Payment history',reports:'Revenue & attendance reports',
  leads:'Lead pipeline & CRM',ai_chatbot:'AI support chatbot (RAG)',ai_insights:'Smart attendance insights',
  ai_churn:'Churn prediction model',ai_forecasting:'Revenue forecasting',
  ai_workout:'AI workout & diet planner',trainer_portal:'Trainer session & plan portal',
  member_portal:'Member self-service app',billing:'Invoice & GST management',
  rbac:'Role & permission editor',equipment:'Equipment & maintenance',reviews:'Member feedback & ratings',
  coupons:'Coupon & referral campaigns',notifications:'Notification centre',
  gym:'Gym profile',branches:'Branch management',membership_plans:'Plan catalog',
  expenses:'Expense tracker',settings:'System settings'
};

const NEXT = {starter:'growth',growth:'pro',pro:'enterprise'};
const PLAN_ORDER = ['starter','growth','pro','enterprise'];

function planNeeded(moduleId){
  return PLAN_ORDER.find(p => PLANS[p].modules.includes(moduleId)) || 'enterprise';
}

let currentPlan = 'starter', activeItem = 'dashboard';

function renderNav(planKey){
  const enabled = new Set(PLANS[planKey].modules);
  const list = document.getElementById('nav-list');
  list.innerHTML = '';
  NAV.forEach(item => {
    if(item.section){
      const s = document.createElement('div');
      s.className = 'nav-section';
      s.textContent = item.section;
      list.appendChild(s);
      return;
    }
    const ok = enabled.has(item.id);
    const div = document.createElement('div');
    const isActive = item.id === activeItem && ok;
    div.className = 'nav-item' + (!ok ? ' locked' : '') + (isActive ? ' active' : '');
    div.title = !ok ? `Available on ${planNeeded(item.id)} plan` : item.label;
    div.innerHTML = `<span class="icon">${item.icon}</span><span class="label">${item.label}</span>${!ok ? '<span class="lock">🔒</span>' : ''}`;
    if(ok){
    div.onclick = () => {
        selectItem(item.id, item.label);

        if(window.innerWidth <= 768){
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
        }
    };
}
    list.appendChild(div);
  });
}

function renderBadge(planKey){
  const p = PLANS[planKey];
  const badge = document.getElementById('plan-badge');
  badge.className = 'plan-badge ' + p.badgeClass;
  badge.innerHTML = `<span class="tier-dot" style="background:${p.dot}"></span><span>${p.label}</span>`;
  const next = NEXT[planKey];
  const hint = document.getElementById('upgrade-hint');
  if(next){
    hint.classList.remove('hidden');
    document.getElementById('upgrade-text').textContent = `Upgrade to ${PLANS[next].label} — ${PLANS[next].price}`;
  } else {
    hint.classList.add('hidden');
  }
}

function selectItem(id, label){
  activeItem = id;
  document.getElementById('topbar-title').textContent = label;
  renderNav(currentPlan);
  renderContent(id);
}

function renderContent(id){
  const mc = document.getElementById('main-content');
  if(id === 'dashboard'){
    mc.innerHTML = `
      <div class="stat-row">
        <div class="stat-card"><div class="stat-label">Active members</div><div class="stat-val">142</div></div>
        <div class="stat-card"><div class="stat-label">Revenue this month</div><div class="stat-val">₹1.2L</div></div>
        <div class="stat-card"><div class="stat-label">Attendance today</div><div class="stat-val">38</div></div>
      </div>
      <div class="module-preview">
        <span class="mp-icon">📊</span>
        <div><div class="mp-title">Welcome back!</div><div class="mp-sub">Here's your gym at a glance for today.</div></div>
      </div>`;
  } else {
    mc.innerHTML = `
      <div class="module-preview">
        <span class="mp-icon">${NAV.find(n=>n.id===id)?.icon||'📄'}</span>
        <div>
          <div class="mp-title">${MODULE_LABELS[id]||id}</div>
          <div class="mp-sub">This module is active on your current plan.</div>
        </div>
      </div>`;
  }
}

function setPlan(planKey, btn){
  currentPlan = planKey;
  document.querySelectorAll('.plan-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderNav(planKey);
  renderBadge(planKey);
}

function showUpgrade(){
  const next = NEXT[currentPlan];
  if(next) alert(`Upgrade to ${PLANS[next].label} (${PLANS[next].price}) to unlock more modules.`);
}

renderNav('starter');
renderBadge('starter');
renderContent('dashboard');

const sidebar=document.querySelector(".sidebar");
const menuBtn=document.getElementById("menuBtn");
const overlay=document.getElementById("overlay");

menuBtn.onclick=()=>{
    sidebar.classList.add("open");
    overlay.classList.add("show");
}

overlay.onclick=()=>{
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}

window.addEventListener("resize", () => {
    if(window.innerWidth > 768){
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
    }
});

</script>
</body>
</html>
